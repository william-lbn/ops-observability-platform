fullnameOverride: ops-loki
deploymentMode: SingleBinary
loki:
  image: {tag: 3.6.20}
  auth_enabled: true
  commonConfig: {replication_factor: 1}
  storage: {type: filesystem}
  schemaConfig:
    configs:
      - from: '2024-04-01'
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: index_, period: 24h}
  limits_config:
    allow_structured_metadata: true
    retention_period: 48h
    ingestion_rate_mb: 2
    ingestion_burst_size_mb: 4
    max_query_lookback: 48h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
singleBinary:
  replicas: 1
  persistence: {size: 8Gi, enableStatefulSetAutoDeletePVC: true, whenDeleted: Retain, whenScaled: Retain}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: '2', memory: 1Gi}
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
gateway: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
sidecar:
  rules: {enabled: false}
minio: {enabled: false}
