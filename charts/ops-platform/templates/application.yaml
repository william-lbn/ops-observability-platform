{{- if .Values.neonEnabled }}{{ fail "Neon integration is disabled in the common platform release" }}{{- end }}
{{- $repo := required "image.repository is required" .Values.image.repository }}
{{- $digest := required "image.digest is required" .Values.image.digest }}
{{- $reference := required "referenceImage.repository is required" .Values.referenceImage.repository }}
{{- $referenceDigest := required "referenceImage.digest is required" .Values.referenceImage.digest }}
{{- range $component := list "api" "worker" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ ternary (printf "ops-observability-%s" $component) (printf "ops-%s" $component) (eq $.Values.workloadNaming "descriptive") }}
  labels: {app.kubernetes.io/part-of: ops-observability-platform}
spec:
  replicas: {{ if eq $component "api" }}{{ $.Values.replicas }}{{ else }}1{{ end }}
  selector:
    matchLabels: {app: ops-{{ $component }}}
  template:
    metadata:
      labels: {app: ops-{{ $component }}, app.kubernetes.io/part-of: ops-observability-platform}
    spec:
      serviceAccountName: {{ if eq $component "worker" }}ops-worker{{ else }}ops-api{{ end }}
      automountServiceAccountToken: {{ eq $component "worker" }}
      terminationGracePeriodSeconds: 35
      imagePullSecrets: {{ $.Values.imagePullSecrets | toJson }}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: {{ $component }}
          image: {{ printf "%s@%s" $repo $digest | quote }}
          args: ["-mode={{ $component }}", "-config=/etc/ops/config.json"]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: '1', memory: 256Mi}
          {{- if eq $component "api" }}
          ports: [{name: https, containerPort: 8443}, {name: metrics, containerPort: 9090}]
          lifecycle: {preStop: {exec: {command: [/platform, '-mode=prestop']}}}
          readinessProbe: {httpGet: {path: /readyz, port: https, scheme: HTTPS}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: https, scheme: HTTPS}, initialDelaySeconds: 10, periodSeconds: 10}
          {{- else }}
          ports: [{name: metrics, containerPort: 9090}]
          livenessProbe: {httpGet: {path: /healthz, port: metrics}, initialDelaySeconds: 15, periodSeconds: 15}
          {{- end }}
          volumeMounts:
            - {name: config, mountPath: /etc/ops, readOnly: true}
            - {name: tls, mountPath: /etc/ops-tls, readOnly: true}
      volumes:
        - name: config
          secret: {secretName: {{ $.Values.configSecret }}, defaultMode: 0440}
        - name: tls
          secret: {secretName: {{ $.Values.tlsSecret }}, defaultMode: 0440}
{{- end }}
---
apiVersion: v1
kind: Service
metadata: {name: ops-api}
spec:
  type: NodePort
  selector: {app: ops-api}
  ports: [{name: https, port: 8443, targetPort: https, nodePort: {{ .Values.nodePort }}}]
---
apiVersion: v1
kind: Service
metadata: {name: ops-api-metrics}
spec:
  selector: {app: ops-api}
  ports: [{name: metrics, port: 9090, targetPort: metrics}]
---
apiVersion: v1
kind: Service
metadata: {name: ops-worker-metrics}
spec:
  selector: {app: ops-worker}
  ports: [{name: metrics, port: 9090, targetPort: metrics}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ ternary "ops-observability-test-reference" "ops-reference" (eq .Values.workloadNaming "descriptive") }}
  labels: {app.kubernetes.io/part-of: ops-observability-platform}
spec:
  replicas: 1
  selector:
    matchLabels: {app: ops-reference}
  template:
    metadata:
      labels: {app: ops-reference, app.kubernetes.io/part-of: ops-observability-platform}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: {{ .Values.imagePullSecrets | toJson }}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: reference
          image: {{ printf "%s@%s" $reference $referenceDigest | quote }}
          env:
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.referenceTelemetry.endpoint | quote }}}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef: {name: {{ .Values.referenceTelemetry.secretName }}, key: headers, optional: true}
            {{- if .Values.referenceTelemetry.tls.enabled }}
            - {name: OTEL_EXPORTER_OTLP_CERTIFICATE, value: /etc/otel-client/ca.crt}
            - {name: OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE, value: /etc/otel-client/tls.crt}
            - {name: OTEL_EXPORTER_OTLP_CLIENT_KEY, value: /etc/otel-client/tls.key}
            {{- end }}
          {{- if .Values.referenceTelemetry.tls.enabled }}
          volumeMounts: [{name: otel-client, mountPath: /etc/otel-client, readOnly: true}]
          {{- end }}
          ports: [{name: http, containerPort: 8081}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 2}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
      {{- if .Values.referenceTelemetry.tls.enabled }}
      volumes: [{name: otel-client, secret: {secretName: {{ .Values.referenceTelemetry.tls.secretName }}, defaultMode: 0440}}]
      {{- end }}
---
apiVersion: v1
kind: Service
metadata: {name: ops-reference}
spec:
  selector: {app: ops-reference}
  ports: [{name: http, port: 8081, targetPort: http}]
