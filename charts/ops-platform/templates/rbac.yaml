apiVersion: v1
kind: ServiceAccount
metadata: {name: ops-api}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: ops-worker}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: ops-worker-read}
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: ops-worker-read}
subjects: [{kind: ServiceAccount, name: ops-worker, namespace: {{ .Release.Namespace }}}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ops-worker-read}
