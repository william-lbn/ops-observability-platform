{{- if .Values.networkIsolation.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ops-core-ingress}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ops-api-entry}
spec:
  podSelector: {matchLabels: {app: ops-api}}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: 8443, protocol: TCP}]
{{- end }}
