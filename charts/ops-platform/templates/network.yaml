{{- if .Values.networkIsolation.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ops-core-ingress}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ops-api-entry}
spec:
  podSelector: {{ if eq .Values.workloadNaming "descriptive" }}{matchLabels: {ops.platform/route: api}}{{ else }}{matchLabels: {app: ops-api}}{{ end }}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: 8443, protocol: TCP}]
{{- end }}
