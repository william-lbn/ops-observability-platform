name: 公共平台持续集成
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: 合同、权限、数据库与应用构建
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_DB: ops_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-ephemeral-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ops_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      OPS_TEST_DATABASE_URL: postgres://postgres:ci-ephemeral-password@localhost:5432/ops_test?sslmode=disable
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: 1.27.4
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 中文前端类型检查与离线资源构建
        working-directory: web
        run: npm ci && npm run check && npm run build
      - name: 格式、模块边界与静态检查
        run: |
          test -z "$(gofmt -l cmd internal contracts/contracts.go)"
          go list -deps ./internal/... > /tmp/core-dependencies.txt
          if grep -q '/providers/' /tmp/core-dependencies.txt; then exit 1; fi
          go vet ./...
      - name: 真实 PostgreSQL 隔离、事务回滚与权限负向验证
        run: go test -p=2 -count=1 -race -v ./... | tee /tmp/go-tests.txt
      - name: 构建精确应用和容器制品
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          BUILD_VERSION="$(python3 tools/source-fingerprint.py --version)"
          python3 tools/source-fingerprint.py > dist/source-fingerprint.json
          go build -buildvcs=false -trimpath -ldflags="-s -w -X main.Version=${BUILD_VERSION}" -o dist/platform ./cmd/platform
          go build -buildvcs=false -trimpath -ldflags='-s -w' -o dist/reference ./cmd/reference
          go mod vendor
          python3 tools/build-images.py
          sha256sum dist/*.docker.tar > dist/SHA256SUMS
      - name: 校验公共 Chart 安全边界
        run: |
          curl --fail --silent --show-error --location https://get.helm.sh/helm-v4.3.2-linux-amd64.tar.gz -o /tmp/helm.tar.gz
          echo 'd1c0278d46beab79582d7e50f5b3dc206944ba8e577cde618513fd07daa53983  /tmp/helm.tar.gz' | sha256sum --check
          tar -xzf /tmp/helm.tar.gz -C /tmp
          export PATH="/tmp/linux-amd64:$PATH"
          python3 tests/validate-chart.py
      - name: 应用 HTTPS 与数据库端到端验证
        run: python3 tests/ci-e2e.py
      - name: 保存构建核验制品与测试记录
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-platform-verification-${{ github.sha }}
          path: |
            dist/*.docker.tar
            dist/SHA256SUMS
            dist/THIRD_PARTY_NOTICES.txt
            dist/source-fingerprint.json
            /tmp/go-tests.txt
          retention-days: 7
          if-no-files-found: warn
